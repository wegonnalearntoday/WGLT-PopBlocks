<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WGLT Pop Blocks v10</title>
<style>
body{font-family:Arial;background:#111;color:#fff}
.modal{max-height:90vh;overflow-y:auto;padding:10px;background:#222;border-radius:10px}
.tutorialCard{border:1px solid #555;padding:10px;margin:10px;cursor:pointer}
</style>
</head>
<body>

<h2>Specials Tutorial</h2>
<div class="modal" id="tutorialOverlay">

<div class="tutorialCard" onclick="loadDemo('brain')">🧠 Brain</div>
<div class="tutorialCard" onclick="loadDemo('bomb')">💣 Bomb</div>
<div class="tutorialCard" onclick="loadDemo('rainbow')">🌈 Rainbow</div>
<div class="tutorialCard" onclick="loadDemo('line')">⚡ Line</div>

</div>

<h3 id="output">Demo output</h3>

<script>
let multiplier = false;

function loadDemo(type){
 document.getElementById("output").innerText = "Loaded: " + type;
 if(type === "brain"){
   multiplier = true;
 }
}

function simulatePop(){
 let base = 20;
 let result = base;
 let text = "Base: " + base;
 if(multiplier){
   result = base * 2;
   text += " → x2 = " + result;
   multiplier = false;
 }
 document.getElementById("output").innerText = text;
}
</script>

<button onclick="simulatePop()">Test Pop</button>

</body>
</html>
